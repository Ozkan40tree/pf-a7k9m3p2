name: Portfoy Fiyat Guncelleme

on:
  schedule:
    # TR saati = UTC+3
    - cron: '30 7 * * 1-5'    # 10:30 TR
    - cron: '30 9 * * 1-5'    # 12:30 TR
    - cron: '30 11 * * 1-5'   # 14:30 TR
    - cron: '35 15 * * 1-5'   # 18:35 TR (kapanis)
  workflow_dispatch:
    inputs:
      kapanis:
        description: 'Kapanis modu (gecmis.json a kayit yapar)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

# Repo'ya yazan tum workflow'lar ayni kilidi paylasir (benchmark-guncelle.yml ile ortak).
# Ayni anda iki is push yapip birbirini reddetmesin diye siraya girerler.
concurrency:
  group: repo-yazma
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bagimliliklari yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kapanis modu mu belirle
        id: mod
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "35 15 * * 1-5" ]; then
            echo "kapanis=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.kapanis }}" = "true" ]; then
            echo "kapanis=true" >> $GITHUB_OUTPUT
          else
            echo "kapanis=false" >> $GITHUB_OUTPUT
          fi

      - name: Fiyat guncelleme calistir
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEETS_ID: ${{ secrets.SHEETS_ID }}
        run: |
          if [ "${{ steps.mod.outputs.kapanis }}" = "true" ]; then
            python scripts/fiyat_guncelle.py --kapanis
          else
            python scripts/fiyat_guncelle.py
          fi

      - name: Degisiklikleri commit et
        run: |
          echo "=== DEBUG: Calisma dizini ==="
          pwd
          echo "=== DEBUG: JSON dosyalari nerede? ==="
          ls -la *.json 2>/dev/null || echo "JSON dosyasi yok"
          echo "=== DEBUG: git status (commit oncesi) ==="
          git status --short
          echo "=== DEBUG: prices.json son guncelleme alani ==="
          if [ -f prices.json ]; then
            head -3 prices.json
          else
            echo "prices.json YOK"
          fi
          echo "=== /DEBUG ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlaniyor."
          else
            echo "=== Commit'lenecek dosyalar: ==="
            git diff --cached --name-only
            TZ='Europe/Istanbul' git commit -m "Otomatik guncelleme $(TZ='Europe/Istanbul' date '+%Y-%m-%d %H:%M')"
            # Push reddedilirse (arada baska bir is push yaptiysa): uzaktakini cek,
            # commit'i ustune tasi, 3 kez dene. Cakismada YENI veri kazanir (-X theirs).
            # Tasima sonrasi JSON bozulduysa push iptal edilir.
            for i in 1 2 3; do
              if git push origin HEAD:main; then echo "Push basarili (deneme $i)"; exit 0; fi
              echo "Push reddedildi (deneme $i/3), uzak degisiklikler cekiliyor..."
              git fetch --deepen=50 origin main
              if git rebase -X theirs origin/main; then
                for f in *.json; do
                  python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "BOZUK JSON: $f - push iptal"; exit 1; }
                done
              else
                git rebase --abort; echo "Rebase basarisiz"
              fi
              sleep $((i * 5))
            done
            echo "Push 3 denemede basarisiz"; exit 1
          fi
