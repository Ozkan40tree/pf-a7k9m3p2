name: Portfoy Fiyat Guncelleme

on:
  schedule:
    # TR saati = UTC+3
    - cron: '30 7 * * 1-5'    # 10:30 TR
    - cron: '30 9 * * 1-5'    # 12:30 TR
    - cron: '30 11 * * 1-5'   # 14:30 TR
    - cron: '35 15 * * 1-5'   # 18:35 TR (kapanis)
  workflow_dispatch:
    inputs:
      kapanis:
        description: 'Kapanis modu (gecmis.json a kayit yapar)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bagimliliklari yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kapanis modu mu belirle
        id: mod
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "35 15 * * 1-5" ]; then
            echo "kapanis=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.kapanis }}" = "true" ]; then
            echo "kapanis=true" >> $GITHUB_OUTPUT
          else
            echo "kapanis=false" >> $GITHUB_OUTPUT
          fi

      - name: Fiyat guncelleme calistir
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEETS_ID: ${{ secrets.SHEETS_ID }}
        run: |
          if [ "${{ steps.mod.outputs.kapanis }}" = "true" ]; then
            python scripts/fiyat_guncelle.py --kapanis
          else
            python scripts/fiyat_guncelle.py
          fi

      - name: Degisiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json portfoy.json yilbasi_fiyatlari.json gecmis.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlaniyor."
          else
            TZ='Europe/Istanbul' git commit -m "Otomatik guncelleme $(TZ='Europe/Istanbul' date '+%Y-%m-%d %H:%M')"
            git push origin main
          fi
