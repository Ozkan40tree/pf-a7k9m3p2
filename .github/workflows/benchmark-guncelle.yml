name: Benchmark Guncelleme

on:
  schedule:
    # Her gun TR saati 19:00 (UTC 16:00) - kapanis sonrasi
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    inputs:
      gecmis:
        description: '5 yillik gecmisi tek seferlik cek (sadece ilk kurulumda)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

# Repo'ya yazan tum workflow'lar ayni kilidi paylasir (portfoy-guncelle.yml ile ortak).
concurrency:
  group: repo-yazma
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bagimliliklari yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Benchmark guncelleme calistir
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEETS_ID: ${{ secrets.SHEETS_ID }}
        run: |
          if [ "${{ inputs.gecmis }}" = "true" ]; then
            python scripts/benchmark_fiyat.py --gecmis
          else
            python scripts/benchmark_fiyat.py
          fi

      - name: Degisiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark_gecmis.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlaniyor."
          else
            TZ='Europe/Istanbul' git commit -m "Benchmark guncelleme $(TZ='Europe/Istanbul' date '+%Y-%m-%d %H:%M')"
            # Push reddedilirse: uzaktakini cek, ustune tasi, 3 kez dene (portfoy-guncelle.yml ile ayni mantik).
            for i in 1 2 3; do
              if git push origin HEAD:main; then echo "Push basarili (deneme $i)"; exit 0; fi
              echo "Push reddedildi (deneme $i/3), uzak degisiklikler cekiliyor..."
              git fetch --deepen=50 origin main
              if git rebase -X theirs origin/main; then
                for f in *.json; do
                  python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "BOZUK JSON: $f - push iptal"; exit 1; }
                done
              else
                git rebase --abort; echo "Rebase basarisiz"
              fi
              sleep $((i * 5))
            done
            echo "Push 3 denemede basarisiz"; exit 1
          fi
