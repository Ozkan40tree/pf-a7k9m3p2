<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Özel Sayfa</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root {
    --bg-deep: #070b14;
    --bg-panel: #0d1526;
    --bg-glass: rgba(255, 255, 255, 0.035);
    --bg-glass-strong: rgba(255, 255, 255, 0.06);
    --border-soft: rgba(148, 163, 184, 0.12);
    --border-glow: rgba(34, 211, 238, 0.22);
    --border-purple: rgba(168, 85, 247, 0.25);
    --cyan: #22d3ee;
    --cyan-deep: #06b6d4;
    --purple: #a855f7;
    --purple-light: #c084fc;
    --violet: #8b5cf6;
    --text: #e8edf6;
    --text-dim: #94a3b8;
    --text-faint: #64748b;
    --pos: #34d399;
    --neg: #fb7185;
    --grad-accent: linear-gradient(135deg, #22d3ee 0%, #818cf8 50%, #a855f7 100%);
    --grad-bar: linear-gradient(90deg, #a855f7, #22d3ee);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-deep);
    background-image:
      radial-gradient(900px 500px at 85% -5%, rgba(34, 211, 238, 0.10), transparent 60%),
      radial-gradient(800px 500px at 10% 0%, rgba(168, 85, 247, 0.10), transparent 60%);
    background-attachment: fixed;
    color: var(--text); -webkit-font-smoothing: antialiased; padding-bottom: 40px;
  }

  /* ── PAROLA EKRANI ── */
  .lock-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(700px 500px at 80% 10%, rgba(34, 211, 238, 0.14), transparent 60%),
      radial-gradient(700px 500px at 15% 90%, rgba(168, 85, 247, 0.16), transparent 60%),
      linear-gradient(135deg, #070b14 0%, #0d1526 100%);
    z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .lock-card {
    background: var(--bg-glass-strong); backdrop-filter: blur(20px);
    border: 1px solid var(--border-glow); border-radius: 24px;
    padding: 40px 32px; max-width: 360px; width: 100%; text-align: center; color: var(--text);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(34, 211, 238, 0.08);
  }
  .lock-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .lock-card p { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
  .lock-icon { font-size: 42px; margin-bottom: 16px; }
  .lock-card input {
    width: 100%; padding: 14px 18px; border: 1px solid var(--border-soft);
    border-radius: 12px; background: rgba(255, 255, 255, 0.05); color: var(--text);
    font-size: 16px; outline: none; transition: all 0.2s;
  }
  .lock-card input:focus { border-color: var(--cyan); background: rgba(34, 211, 238, 0.06); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12); }
  .lock-card input::placeholder { color: var(--text-faint); }
  .lock-card button {
    width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 12px;
    background: var(--grad-accent); color: #0a0e1a;
    font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  }
  .lock-card button:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(34, 211, 238, 0.3); }
  .lock-error { color: var(--neg); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .hidden { display: none !important; }

  /* ── HEADER ── */
  .header {
    background:
      linear-gradient(135deg, rgba(13, 21, 38, 0.9) 0%, rgba(10, 14, 26, 0.95) 100%);
    color: var(--text); padding: 32px 20px;
    border-bottom-left-radius: 28px; border-bottom-right-radius: 28px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    border-bottom: 1px solid var(--border-glow);
    position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: -60%; right: -8%;
    width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(34, 211, 238, 0.18) 0%, rgba(168, 85, 247, 0.10) 40%, transparent 70%);
    pointer-events: none;
  }
  .header-inner { max-width: 980px; margin: 0 auto; position: relative; z-index: 2; }
  .header-flex { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 8px; height: 8px; background: var(--pos); border-radius: 50%; box-shadow: 0 0 8px var(--pos); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.5), 0 0 8px var(--pos);} 70% { box-shadow: 0 0 0 8px rgba(52,211,153,0), 0 0 8px var(--pos);} }
  .header-total { text-align: right; position: relative; }
  .privacy-btn {
    background: var(--bg-glass-strong); backdrop-filter: blur(10px);
    border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 6px 10px; font-size: 16px; cursor: pointer; color: var(--text);
    margin-bottom: 6px; transition: all 0.2s; line-height: 1;
  }
  .privacy-btn:hover { background: var(--bg-glass-strong); border-color: var(--cyan); transform: translateY(-1px); }
  .privacy-btn.active { background: var(--purple); border-color: var(--purple-light); box-shadow: 0 0 16px rgba(168, 85, 247, 0.4); }
  .header-total .label { color: var(--text-dim); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
  .header-total .value { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin: 4px 0;
    background: var(--grad-accent); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 12px rgba(34, 211, 238, 0.25)); }

  .summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 24px; }
  .summary-card {
    background: var(--bg-glass); backdrop-filter: blur(10px);
    border: 1px solid var(--border-soft); border-radius: 16px; padding: 14px;
    transition: border-color 0.25s, transform 0.25s;
  }
  .summary-card:hover { border-color: var(--border-glow); transform: translateY(-2px); }
  .summary-card .label { color: var(--text-dim); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .summary-card .val { font-size: 17px; font-weight: 700; margin-top: 4px; color: var(--text); }
  .summary-card .val.green { color: var(--pos); }
  .summary-card .val.red   { color: var(--neg); }
  .green { color: var(--pos); } .red { color: var(--neg); }

  .container { max-width: 980px; margin: -20px auto 0; padding: 0 16px; position: relative; z-index: 10; }

  /* ── TABS ── */
  .tabs {
    display: flex; gap: 6px; margin-bottom: 24px;
    background: var(--bg-glass); backdrop-filter: blur(12px);
    padding: 6px; border-radius: 18px;
    border: 1px solid var(--border-soft);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    flex-wrap: wrap; justify-content: center;
  }
  .tab { padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 14px;
    cursor: pointer; color: var(--text-dim); transition: all 0.3s; border: none; background: transparent; }
  .tab:hover { color: var(--text); background: var(--bg-glass-strong); }
  .tab.active { background: var(--grad-accent); color: #0a0e1a; box-shadow: 0 4px 18px rgba(34, 211, 238, 0.3); }

  /* ── SECTIONS ── */
  .section {
    background: var(--bg-panel); border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    padding: 22px; margin-bottom: 18px; border: 1px solid var(--border-soft);
  }
  .section h3 { font-size: 17px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; color: var(--text); }
  .section h3 .subtotal { font-size: 13px; color: var(--cyan); font-weight: 600; background: rgba(34, 211, 238, 0.08); border: 1px solid var(--border-glow); padding: 4px 10px; border-radius: 8px; }

  /* ── CARDS ── */
  .cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { border-radius: 16px; padding: 14px; border: 1px solid var(--border-soft); background: var(--bg-glass); transition: transform 0.2s, border-color 0.2s; }
  .card:hover { transform: translateY(-2px); border-color: var(--border-glow); box-shadow: 0 10px 24px rgba(0,0,0,0.3); }
  .card.dark { background: linear-gradient(135deg, rgba(34, 211, 238, 0.10), rgba(168, 85, 247, 0.10)); color: var(--text); border: 1px solid var(--border-glow); }
  .card .clabel { font-size: 11px; color: var(--text-dim); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .card.dark .clabel { color: var(--text-dim); }
  .card .cval { font-size: 20px; font-weight: 800; margin-top: 4px; color: var(--text); }

  /* ── BADGES ── */
  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; }
  .badge.pos { background: rgba(52, 211, 153, 0.14); color: var(--pos); border: 1px solid rgba(52, 211, 153, 0.25); }
  .badge.neg { background: rgba(251, 113, 133, 0.14); color: var(--neg); border: 1px solid rgba(251, 113, 133, 0.25); }
  .badge.zero { background: var(--bg-glass-strong); color: var(--text-dim); border: 1px solid var(--border-soft); }

  /* ── TABLES ── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: right; padding: 10px 6px; font-weight: 600; color: var(--text-dim); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid var(--border-glow); white-space: nowrap; }
  th:first-child { text-align: left; }
  td { padding: 12px 6px; text-align: right; border-bottom: 1px solid var(--border-soft); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text-dim); }
  td:first-child { text-align: left; font-weight: 700; color: var(--text); }
  tbody tr:hover { background: rgba(34, 211, 238, 0.04); }
  tfoot td { font-weight: 700; border-top: 1px solid var(--border-glow); border-bottom: none; padding-top: 14px; background: rgba(255, 255, 255, 0.02); color: var(--text); }
  .val-pos { color: var(--pos); font-weight: 600; } .val-neg { color: var(--neg); font-weight: 600; } .val-zero { color: var(--text-faint); }
  .weight-bar { display: inline-block; width: 38px; height: 5px; background: rgba(148, 163, 184, 0.15); border-radius: 3px; overflow: hidden; margin-right: 6px; vertical-align: middle; }
  .weight-bar-fill { height: 100%; background: var(--grad-bar); }

  /* ── KRIPTO ── */
  .kripto-row { background: var(--bg-glass); border: 1px solid var(--border-soft); border-radius: 16px; padding: 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .kleft { font-size: 18px; font-weight: 800; color: var(--text); }
  .kleft small { font-weight: 500; font-size: 13px; color: var(--cyan); background: rgba(34, 211, 238, 0.08); border: 1px solid var(--border-glow); padding: 2px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; }
  .kitems { display: flex; flex-wrap: wrap; gap: 18px; justify-content: flex-end; }
  .kitem .kl { font-size: 10px; color: var(--text-faint); text-transform: uppercase; }
  .kitem .kv { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--text); }

  /* ── DIST ── */
  .dist-bar { display: flex; height: 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-soft); margin-top: 10px; }
  .dist-legend { display: flex; flex-wrap: wrap; gap: 8px; }
  .dist-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); font-weight: 500; }
  .dist-dot { width: 10px; height: 10px; border-radius: 3px; }

  /* ── LOADING ── */
  .loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .err-msg { background: rgba(251, 113, 133, 0.1); color: #fda4af; border: 1px solid rgba(251, 113, 133, 0.3); border-radius: 12px; padding: 16px; margin: 16px; }

  /* ── BENCHMARK ── */
  .bench-controls { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
  .bench-select-wrap { display: flex; flex-direction: column; gap: 6px; }
  .bench-select-wrap label { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .bench-select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border-soft); background: var(--bg-glass); font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2322d3ee%22%20stroke-width%3D%223%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 14px center; background-size: 12px; padding-right: 36px; }
  .bench-select option { background: var(--bg-panel); color: var(--text); }
  .bench-select:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12); }
  .bench-periods { display: flex; flex-wrap: wrap; gap: 6px; }
  .bench-period-btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border-soft); background: var(--bg-glass); font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; transition: all 0.2s; }
  .bench-period-btn:hover { background: var(--bg-glass-strong); color: var(--text); }
  .bench-period-btn.active { background: var(--grad-accent); color: #0a0e1a; border-color: transparent; box-shadow: 0 4px 14px rgba(34, 211, 238, 0.25); }
  .bench-chart-wrap { position: relative; height: 360px; margin: 8px 0 18px; }
  .bench-info { font-size: 12px; color: var(--text-dim); line-height: 1.55; background: rgba(34, 211, 238, 0.05); border-left: 3px solid var(--cyan); padding: 10px 14px; border-radius: 8px; margin-top: 14px; }
  .bench-warn { font-size: 12px; color: #fcd34d; background: rgba(245, 158, 11, 0.08); border-left: 3px solid #f59e0b; padding: 10px 14px; border-radius: 8px; margin-top: 14px; }
  .bench-table-wrap { overflow-x: auto; }
  .bench-table th:first-child, .bench-table td:first-child { text-align: left; min-width: 130px; }
  .bench-table .bench-row-self td:first-child { color: var(--cyan); }
  .bench-table .bench-row-fark { background: rgba(255, 255, 255, 0.02); font-weight: 700; }
  @media (max-width: 720px) {
    .bench-chart-wrap { height: 280px; }
    .bench-period-btn { padding: 7px 10px; font-size: 12px; }
  }

  /* ── GECMIS VERILER ── */
  .gecmis-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
  .gecmis-date-wrap { display: flex; flex-direction: column; gap: 6px; }
  .gecmis-date-wrap label { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .gecmis-date { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-soft); background: var(--bg-glass); font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; font-family: inherit; color-scheme: dark; }
  .gecmis-date:focus { outline: none; border-color: var(--cyan); }
  .gecmis-clear-btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-soft); background: var(--bg-glass); font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; transition: all 0.2s; }
  .gecmis-clear-btn:hover { background: var(--bg-glass-strong); color: var(--text); }
  .gecmis-table-wrap { overflow-x: auto; max-height: 70vh; border: 1px solid var(--border-soft); border-radius: 10px; }
  .gecmis-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  .gecmis-table th { position: sticky; top: 0; background: #111c30; z-index: 2; padding: 10px 8px; text-align: right; font-size: 11px; font-weight: 700; color: var(--text-dim); border-bottom: 1px solid var(--border-glow); white-space: nowrap; }
  .gecmis-table th:first-child, .gecmis-table td:first-child { position: sticky; left: 0; background: var(--bg-panel); z-index: 1; text-align: left; font-weight: 700; border-right: 1px solid var(--border-glow); color: var(--text); }
  .gecmis-table th:first-child { background: #111c30; z-index: 3; }
  .gecmis-table td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--border-soft); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text-dim); }
  .gecmis-table tbody tr:hover { background: rgba(34, 211, 238, 0.04); }
  .gecmis-table tbody tr:hover td:first-child { background: #131d33; }
  .gecmis-table tbody tr.highlight { background: rgba(168, 85, 247, 0.14) !important; }
  .gecmis-table tbody tr.highlight td:first-child { background: rgba(168, 85, 247, 0.18) !important; }
  .gecmis-empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }

  /* ── GRAFIK TABI ── */
  .grafik-controls { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
  .grafik-chart-wrap { position: relative; height: 400px; margin: 8px 0; }
  @media (max-width: 720px) {
    .grafik-chart-wrap { height: 300px; }
    .gecmis-table { font-size: 11px; }
    .gecmis-table th, .gecmis-table td { padding: 7px 6px; }
  }

  @media (max-width: 720px) {
    .header { padding: 24px 14px; }
    .header-total .value { font-size: 26px; }
    h1 { font-size: 19px; }
    .section { padding: 14px; }
    table { font-size: 11px; }
    th, td { padding: 8px 3px; font-size: 10px; }
    th { font-size: 9px; }
    .card .cval { font-size: 17px; }
    .kitems { gap: 12px; }
    .weight-bar { width: 24px; }
    .tab { padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- ═══ PAROLA EKRANI ═══ -->
<div class="lock-overlay" id="lock">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2>Özel Sayfa</h2>
    <p>Devam etmek için parolanızı girin</p>
    <input type="password" id="lock-input" placeholder="Parola" autocomplete="off">
    <button onclick="checkPassword()">Giriş</button>
    <div class="lock-error" id="lock-err"></div>
  </div>
</div>

<!-- ═══ ANA İÇERİK ═══ -->
<div id="main" class="hidden">
  <div class="header">
    <div class="header-inner">
      <div class="header-flex">
        <div>
          <h1>📊 Aile Portföy Raporu</h1>
          <div class="subtitle"><span class="live-dot"></span> <span id="last-update"></span></div>
        </div>
        <div class="header-total">
          <button id="privacy-btn" class="privacy-btn" type="button" onclick="togglePrivacy()" title="Gizlilik modu">👁</button>
          <div class="label">Toplam Aile Varlığı</div>
          <div class="value" id="genel-toplam">—</div>
        </div>
      </div>
      <div class="summary-row" id="summary-row"></div>
    </div>
  </div>

  <div class="container">
    <div class="tabs" id="tabs"></div>
    <div id="panels"><div class="loading">Yükleniyor…</div></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// PAROLA KORUMASI
// ═══════════════════════════════════════════════
const PASSWORD_HASH = "ozdege15"; // Bu sadece basit bir kontrol — gerçek güvenlik için server-side gerekir
function checkPassword() {
  const input = document.getElementById('lock-input').value.trim().toLowerCase();
  if (input === PASSWORD_HASH) {
    sessionStorage.setItem('unlocked', '1');
    showMain();
  } else {
    document.getElementById('lock-err').textContent = 'Parola hatalı, tekrar deneyin.';
    document.getElementById('lock-input').value = '';
  }
}
function showMain() {
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  loadData();
}
document.getElementById('lock-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});
if (sessionStorage.getItem('unlocked') === '1') showMain();

// ═══════════════════════════════════════════════
// FORMATTERS
// ═══════════════════════════════════════════════
const fmt = n => Math.round(n).toLocaleString('tr-TR');
const fmt2 = n => n.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmt4 = n => n.toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:4});
const fmtP = n => (n>=0?'+':'') + n.toFixed(2) + '%';
const badge = v => {
  if (Math.abs(v) < 0.005) return `<span class="badge zero">0.00%</span>`;
  return `<span class="badge ${v>=0?'pos':'neg'}">${fmtP(v)}</span>`;
};
const tlClass = v => v>0 ? 'val-pos' : (v<0 ? 'val-neg' : 'val-zero');
const tlSign = v => v>0 ? '+' : '';
// fullSign: pozitif için '+', negatif için '-', sıfır için ''. Mutlak değerle birlikte kullanılır.
const fullSign = v => v>0 ? '+' : (v<0 ? '-' : '');
const colors = ['#22d3ee','#a855f7','#818cf8','#34d399','#f472b6','#06b6d4','#c084fc','#fbbf24','#2dd4bf','#60a5fa','#fb7185','#a78bfa'];

// ═══════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════
// Raw veriler: privacy modu acilip kapandiginda hizli yeniden render icin
let _rawPortfoy = null;
let _rawPrices = null;
let _rawBenchmark = null;
let _rawGecmis = null;

async function loadData() {
  try {
    const cb = '?t=' + Date.now();
    const safeFetch = (url) => fetch(url + cb).then(r => r.ok ? r.json() : null).catch(() => null);
    const [portfoy, prices, benchmark, gecmis] = await Promise.all([
      fetch('portfoy.json' + cb).then(r => r.json()),
      fetch('prices.json' + cb).then(r => r.json()),
      safeFetch('benchmark_gecmis.json'),  // yoksa null
      safeFetch('gecmis.json')              // 1 Haziran oncesi yok, null
    ]);
    _rawPortfoy = portfoy;
    _rawPrices = prices;
    _rawBenchmark = benchmark;
    _rawGecmis = gecmis;
    doRender();
  } catch (e) {
    document.getElementById('panels').innerHTML = `<div class="err-msg">Veri yüklenemedi: ${e.message}</div>`;
  }
}

// ═══════════════════════════════════════════════
// GIZLILIK (PRIVACY) MODU
// Aktif iken: aile_toplam = 1.000.000 TL sabit; diger TL ve adetler
// gercek yuzdelere gore orantili olarak yeniden hesaplanir. Birim fiyatlar
// (guncel) gercek piyasa fiyati olarak kalir; maliyet hucreleri "—" gosterilir.
// ═══════════════════════════════════════════════
function isPrivacy() { return sessionStorage.getItem('privacy') === '1'; }

function togglePrivacy() {
  sessionStorage.setItem('privacy', isPrivacy() ? '0' : '1');
  doRender();
}

function normalizePortfoy(portfoy, hedefToplam) {
  hedefToplam = hedefToplam || 1000000;
  const portfoyler = portfoy.portfoyler || {};
  let aileToplam = 0;
  for (const items of Object.values(portfoyler)) {
    for (const it of items) aileToplam += Number(it.guncel_tl || 0);
  }
  if (aileToplam <= 0) return portfoy;
  const k = hedefToplam / aileToplam;
  const yeni = JSON.parse(JSON.stringify(portfoy));
  for (const ad of Object.keys(yeni.portfoyler)) {
    yeni.portfoyler[ad] = yeni.portfoyler[ad].map(it => ({
      ...it,
      adet: (Number(it.adet) || 0) * k,
      guncel_tl: (Number(it.guncel_tl) || 0) * k,
      onceki_tl: (Number(it.onceki_tl) || 0) * k,
      gunluk_kazanc_tl: (Number(it.gunluk_kazanc_tl) || 0) * k,
      // maliyet (birim) AYNEN: render zamani isPrivacy() ile maskelenir
      // gunluk_yuzde AYNEN
    }));
  }
  return yeni;
}

function updatePrivacyButton() {
  const btn = document.getElementById('privacy-btn');
  if (!btn) return;
  const on = isPrivacy();
  btn.textContent = on ? '🙈' : '👁';
  btn.title = on ? 'Gizli mod açık (tıkla: kapat)' : 'Gizli mod (tıkla: aç)';
  btn.className = 'privacy-btn' + (on ? ' active' : '');
}

function normalizeGecmis(gecmis) {
  // Her gun icin kendi katsayisi (genel_toplam=1M olacak sekilde)
  if (!gecmis || !gecmis.gunler) return gecmis;
  const yeni = JSON.parse(JSON.stringify(gecmis));
  for (const tarih of Object.keys(yeni.gunler)) {
    const gun = yeni.gunler[tarih];
    const aileToplam = Number(gun.genel_toplam) || 0;
    if (aileToplam <= 0) continue;
    const k = 1000000 / aileToplam;
    for (const kisi of ['ozkan', 'derya']) {
      if (!gun[kisi]) continue;
      gun[kisi].toplam = (Number(gun[kisi].toplam) || 0) * k;
      const cats = gun[kisi].kategoriler || {};
      for (const c of Object.keys(cats)) cats[c] = (Number(cats[c]) || 0) * k;
    }
    gun.genel_toplam = 1000000;
  }
  return yeni;
}

function doRender() {
  if (!_rawPortfoy) return;
  // Aktif tabi hatirla (privacy toggle sonrasi geri donmek icin)
  const aktifBtn = document.querySelector('.tab.active');
  const aktifTab = aktifBtn ? aktifBtn.dataset.panel : null;
  // Eski Chart.js instance'lari kaldır (panel HTML yenilenmeden once destroy)
  if (_benchChart) { _benchChart.destroy(); _benchChart = null; }
  if (_grafikChart) { _grafikChart.destroy(); _grafikChart = null; }
  updatePrivacyButton();
  const p = isPrivacy() ? normalizePortfoy(_rawPortfoy) : _rawPortfoy;
  const g = isPrivacy() ? normalizeGecmis(_rawGecmis) : _rawGecmis;
  render(p, _rawPrices, _rawBenchmark, g);
  // Render sonrasi varsayilan olarak ilk tab aktif. Eski tab farkliysa geri don.
  if (aktifTab && aktifTab !== Object.keys(_rawPortfoy.portfoyler || {})[0]) {
    switchTab(aktifTab);
  }
}

// ═══════════════════════════════════════════════
// YARDIMCI FONKSIYONLAR
// ═══════════════════════════════════════════════
const sum = (arr, f) => arr.reduce((s, x) => s + (x[f] || 0), 0);

function weightBar(pct) {
  return `<span class="weight-bar"><span class="weight-bar-fill" style="width:${Math.min(pct,100)}%"></span></span>${pct.toFixed(1)}%`;
}

// ═══════════════════════════════════════════════
// VERI DONUSUMU - portfoy.json yapisi:
// data.portfoyler.ozkan = [ {tip, kod, adet, maliyet, guncel_tl, onceki_tl,
//                            gunluk_kazanc_tl, gunluk_yuzde, fiyat_eksik}, ... ]
// Tipler: hisse | fon | altinfonu | yurtdisifonu | emeklilik | kripto | alacak
// Hesaplar backend'de yapilmis, frontend sadece okur ve gosterir.
// ═══════════════════════════════════════════════

// Item'i dashboard'in bekledigi alanlarla zenginlestir
function enrichItem(it, prices) {
  const adet = it.adet || 0;
  const maliyetVar = it.maliyet !== null && it.maliyet !== undefined;
  const maliyet = maliyetVar ? it.maliyet : 0;
  const tm = adet * maliyet;
  const tg = it.guncel_tl ?? tm;
  const onceki_tl = it.onceki_tl ?? tg;
  // Hisse/fon icin birim guncel fiyat (alacak/kripto haric)
  const guncel = adet > 0 ? tg / adet : maliyet;
  const gunlukP = it.gunluk_yuzde ?? 0;
  const gunlukKZ = it.gunluk_kazanc_tl ?? 0;
  // Yil basi bilgisi prices.json'dan
  const pricesKey = it.tip === 'kripto'
    ? (prices.kripto || {})[it.kod] || {}
    : it.tip === 'altin'
    ? {}  // altin icin yilbasi takibi yok
    : (prices.hisseler || {})[it.kod] || (prices.fonlar_ve_emeklilik || {})[it.kod] || {};
  const yilbasi = pricesKey.yilbasi ?? null;
  const ybb = (yilbasi && yilbasi > 0) ? ((guncel - yilbasi) / yilbasi) * 100 : 0;
  return {
    ...it,
    adet, maliyet, maliyetVar,
    guncel, tm, tg,
    onceki_tl,
    kz: tg - tm,
    kzp: tm > 0 ? ((tg - tm) / tm) * 100 : 0,
    gunlukP, gunlukKZ,
    ybb,
    guncel_tl: tg
  };
}

function renderPortfoy(name, items, prices) {
  // Items: tek liste, tipe gore ayir
  const hisseler      = items.filter(x => x.tip === 'hisse').map(x => enrichItem(x, prices));
  const yurtdisiList  = items.filter(x => x.tip === 'yurtdisifonu').map(x => enrichItem(x, prices));
  const fonList       = items.filter(x => x.tip === 'fon').map(x => enrichItem(x, prices));
  const altinFonuList = items.filter(x => x.tip === 'altinfonu').map(x => enrichItem(x, prices));
  const emeklilikList = items.filter(x => x.tip === 'emeklilik').map(x => enrichItem(x, prices));
  const fonlarRaw     = [...yurtdisiList, ...fonList, ...altinFonuList, ...emeklilikList];
  const kripto        = items.filter(x => x.tip === 'kripto').map(x => enrichItem(x, prices));
  const altin         = items.filter(x => x.tip === 'altin').map(x => enrichItem(x, prices));
  const alacak        = items.filter(x => x.tip === 'alacak').map(x => enrichItem(x, prices));
  const nakit         = items.filter(x => x.tip === 'nakit').map(x => enrichItem(x, prices));

  const hisseTop     = sum(hisseler, 'tg');
  const yurtdisiTop  = sum(yurtdisiList, 'tg');
  const fonOnlyTop   = sum(fonList, 'tg');
  const altinFonuTop = sum(altinFonuList, 'tg');
  const emeklilikTop = sum(emeklilikList, 'tg');
  const fonTop       = yurtdisiTop + fonOnlyTop + altinFonuTop + emeklilikTop;
  const kriptoTop = sum(kripto, 'tg');
  const altinTop  = sum(altin, 'tg');
  const alacakTop = sum(alacak, 'tg');
  const nakitTop  = sum(nakit, 'tg');
  const toplam = hisseTop + fonTop + kriptoTop + altinTop + alacakTop + nakitTop;

  // Nakit maliyetsizdir; nominal degeri maliyet sayilir ki K/Z sasmasin.
  const maliyet = sum(hisseler,'tm') + sum(fonlarRaw,'tm') + sum(kripto,'tm') + sum(altin,'tm') + sum(alacak,'tm') + nakitTop;
  const kz = toplam - maliyet;
  const kzp = maliyet > 0 ? (toplam/maliyet - 1) * 100 : 0;
  const gunlukKZ = sum(hisseler, 'gunlukKZ') + sum(fonlarRaw, 'gunlukKZ') + sum(kripto, 'gunlukKZ') + sum(altin, 'gunlukKZ');
  const gunlukP = (toplam - gunlukKZ) > 0 ? gunlukKZ / (toplam - gunlukKZ) * 100 : 0;

  const allDaily = [
    ...hisseler.map(h => ({k:h.kod, v:h.gunlukP})),
    ...fonlarRaw.map(f => ({k:f.kod, v:f.gunlukP}))
  ];
  const best  = allDaily.length ? [...allDaily].sort((a,b) => b.v - a.v)[0] : null;
  const worst = allDaily.length ? [...allDaily].sort((a,b) => a.v - b.v)[0] : null;

  // Tab içi büyük kart: kişiye göre dinamik (emeklilik / alacak hariç varlık)
  let ozetBaslik, ozetDeger;
  if (name === 'ozkan') {
    ozetBaslik = 'Emeklilik ve Alacak Hariç Özkan Varlık';
    ozetDeger = toplam - emeklilikTop - alacakTop;
  } else if (name === 'derya') {
    ozetBaslik = 'Emeklilik Hariç Derya Varlık';
    ozetDeger = toplam - emeklilikTop;
  } else {
    ozetBaslik = 'Portföy Değeri';
    ozetDeger = toplam;
  }

  let html = `
    <div class="cards-row">
      <div class="card dark">
        <div class="clabel">${ozetBaslik}</div>
        <div class="cval">₺${fmt(ozetDeger)}</div>
      </div>
      <div class="card">
        <div class="clabel">Günlük K/Z</div>
        <div class="cval ${tlClass(gunlukKZ)}">${tlSign(gunlukKZ)}₺${fmt(Math.abs(gunlukKZ))}</div>
        <div style="margin-top:4px">${badge(gunlukP)}</div>
      </div>
      ${best ? `<div class="card"><div class="clabel">Günün Yıldızı</div><div class="cval">${best.k}</div><div style="margin-top:4px">${badge(best.v)}</div></div>` : ''}
      ${worst && worst.k !== best.k ? `<div class="card"><div class="clabel">Günün En Zayıfı</div><div class="cval">${worst.k}</div><div style="margin-top:4px">${badge(worst.v)}</div></div>` : ''}
    </div>`;

  // Dağılım
  const distItems = [
    ...hisseler.map(h => ({l:h.kod, v:h.tg})),
    ...fonlarRaw.map(f => ({l:f.kod, v:f.tg})),
    ...(kriptoTop > 0 ? kripto.map(c => ({l:c.kod, v:c.tg})) : []),
    ...(altinTop > 0 ? altin.map(a => ({l:a.kod, v:a.tg})) : []),
    ...(alacakTop > 0 ? alacak.map(a => ({l:a.kod, v:a.tg})) : []),
    ...(nakitTop > 0 ? nakit.map(n => ({l:'Nakit '+n.kod, v:n.tg})) : [])
  ];
  if (distItems.length > 0) {
    const distTotal = distItems.reduce((s,x) => s+x.v, 0);
    let barH='', legH='';
    distItems.forEach((it, i) => {
      const pct = it.v/distTotal*100;
      barH += `<div style="width:${pct}%;background:${colors[i%colors.length]}"></div>`;
      legH += `<div class="dist-legend-item"><div class="dist-dot" style="background:${colors[i%colors.length]}"></div>${it.l} ${pct.toFixed(1)}%</div>`;
    });
    html += `<div class="section">
      <div class="dist-legend">${legH}</div>
      <div class="dist-bar">${barH}</div>
    </div>`;
  }

  // Hisseler tablosu
  if (hisseler.length > 0) {
    html += `<div class="section">
      <h3>📈 Hisseler <span class="subtotal">₺${fmt(hisseTop)}</span></h3>
      <div style="overflow-x:auto"><table><thead><tr>
        <th>Kod</th><th>Adet</th><th>Maliyet</th><th>Güncel</th><th>Toplam ₺</th>
        <th>Ağırlık</th><th>Günlük ₺</th><th>Günlük %</th>
        <th>K/Z ₺</th><th>K/Z %</th><th>YBB</th>
      </tr></thead><tbody>`;
    hisseler.forEach(h => {
      const w = hisseTop > 0 ? (h.tg / hisseTop) * 100 : 0;
      html += `<tr>
        <td>${h.kod}</td>
        <td>${fmt(h.adet)}</td>
        <td>${isPrivacy() ? '—' : fmt2(h.maliyet)}</td>
        <td style="font-weight:600">${fmt2(h.guncel)}</td>
        <td>${fmt(h.tg)}</td>
        <td style="color:#64748b;font-size:11px">${weightBar(w)}</td>
        <td class="${tlClass(h.gunlukKZ)}">${tlSign(h.gunlukKZ)}${fmt(Math.abs(h.gunlukKZ))}</td>
        <td>${badge(h.gunlukP)}</td>
        <td class="${tlClass(h.kz)}">${tlSign(h.kz)}${fmt(Math.abs(h.kz))}</td>
        <td>${badge(h.kzp)}</td>
        <td>${badge(h.ybb)}</td>
      </tr>`;
    });
    const t_kz=sum(hisseler,'kz'), t_gk=sum(hisseler,'gunlukKZ');
    const t_kzp = sum(hisseler,'tm') > 0 ? (hisseTop/sum(hisseler,'tm') - 1) * 100 : 0;
    const t_gp = (hisseTop - t_gk) > 0 ? (t_gk / (hisseTop - t_gk)) * 100 : 0;
    html += `</tbody><tfoot><tr>
      <td>TOPLAM</td><td colspan="3"></td><td>₺${fmt(hisseTop)}</td><td>100.0%</td>
      <td class="${tlClass(t_gk)}">${tlSign(t_gk)}${fmt(Math.abs(t_gk))}</td>
      <td>${badge(t_gp)}</td>
      <td class="${tlClass(t_kz)}">${tlSign(t_kz)}${fmt(Math.abs(t_kz))}</td>
      <td>${badge(t_kzp)}</td><td></td>
    </tr></tfoot></table></div></div>`;
  }

  // Fonlar & Emeklilik: 4 ayrı blok (YurtdışıFon, Fon, AltınFonu, Emeklilik)
  // Helper: tek bir tip için tam tablo bloğu üretir.
  // Maliyet null olan satırlarda (emeklilik) Maliyet, K/Z ₺, K/Z %, YBB hücreleri "—" gösterilir.
  function renderFonBlok(baslik, list) {
    if (list.length === 0) return '';
    const blokTop = sum(list, 'tg');
    // Maliyet bilgisi olanların toplamı (TOPLAM satırı K/Z hesabı için)
    const hasMaliyet = list.some(x => x.maliyetVar);
    let h = `<div class="section">
      <h3>${baslik} <span class="subtotal">₺${fmt(blokTop)}</span></h3>
      <div style="overflow-x:auto"><table><thead><tr>
        <th>Kod</th><th>Tip</th><th>Pay</th><th>Maliyet</th><th>Güncel</th><th>Toplam ₺</th>
        <th>Ağırlık</th><th>Günlük ₺</th><th>Günlük %</th>
        <th>K/Z ₺</th><th>K/Z %</th><th>YBB</th>
      </tr></thead><tbody>`;
    list.forEach(f => {
      const w = blokTop > 0 ? (f.tg / blokTop) * 100 : 0;
      const tipEt = f.tip_orjinal || f.tip;
      const showMaliyet = f.maliyetVar && !isPrivacy();  // privacy modda maliyet "—"
      const mvKZ = f.maliyetVar;                          // K/Z gercek maliyet varsa hesaplanir (privacy normalize edilmis gosterir)
      h += `<tr>
        <td>${f.kod}</td>
        <td style="font-size:11px;color:#64748b">${tipEt}</td>
        <td>${fmt(f.adet)}</td>
        <td>${showMaliyet ? fmt4(f.maliyet) : '—'}</td>
        <td style="font-weight:600">${fmt4(f.guncel)}</td>
        <td>${fmt(f.tg)}</td>
        <td style="color:#64748b;font-size:11px">${weightBar(w)}</td>
        <td class="${tlClass(f.gunlukKZ)}">${tlSign(f.gunlukKZ)}${fmt(Math.abs(f.gunlukKZ))}</td>
        <td>${badge(f.gunlukP)}</td>
        <td class="${mvKZ ? tlClass(f.kz) : 'val-zero'}">${mvKZ ? (tlSign(f.kz)+fmt(Math.abs(f.kz))) : '—'}</td>
        <td>${mvKZ ? badge(f.kzp) : '—'}</td>
        <td>${mvKZ ? badge(f.ybb) : '—'}</td>
      </tr>`;
    });
    const t_gk = sum(list, 'gunlukKZ');
    // K/Z toplamı sadece maliyet bilgisi olan kalemler için anlamlı
    const t_tm = sum(list.filter(x => x.maliyetVar), 'tm');
    const t_kz = hasMaliyet ? (sum(list.filter(x => x.maliyetVar), 'tg') - t_tm) : 0;
    const t_kzp = t_tm > 0 ? (t_kz / t_tm) * 100 : 0;
    // Toplam blok için günlük % (tüm kalemler, maliyet şartı yok)
    const t_gp = (blokTop - t_gk) > 0 ? (t_gk / (blokTop - t_gk)) * 100 : 0;
    h += `</tbody><tfoot><tr>
      <td>TOPLAM</td><td colspan="4"></td><td>₺${fmt(blokTop)}</td><td>100.0%</td>
      <td class="${tlClass(t_gk)}">${tlSign(t_gk)}${fmt(Math.abs(t_gk))}</td>
      <td>${badge(t_gp)}</td>
      <td class="${hasMaliyet ? tlClass(t_kz) : 'val-zero'}">${hasMaliyet ? (tlSign(t_kz)+fmt(Math.abs(t_kz))) : '—'}</td>
      <td>${hasMaliyet ? badge(t_kzp) : '—'}</td><td></td>
    </tr></tfoot></table></div></div>`;
    return h;
  }

  html += renderFonBlok('🏦 YurtdışıFon',  yurtdisiList);
  html += renderFonBlok('🏦 Fon',          fonList);
  html += renderFonBlok('🏦 AltınFonu',    altinFonuList);
  html += renderFonBlok('🏦 Emeklilik',    emeklilikList);

  // Kripto
  if (kripto.length > 0) {
    const c = kripto[0];
    const birimFiyat = c.adet > 0 ? c.tg / c.adet : c.maliyet;
    html += `<div class="section">
      <h3>₿ Kripto <span class="subtotal">₺${fmt(kriptoTop)}</span></h3>
      <div class="kripto-row">
        <div class="kleft">₿ ${c.kod}<br><small>${c.adet} ${c.kod}</small></div>
        <div class="kitems">
          <div class="kitem"><div class="kl">Birim Fiyat</div><div class="kv">₺${fmt(birimFiyat)}</div></div>
          <div class="kitem"><div class="kl">Maliyet</div><div class="kv">${isPrivacy() ? '—' : '₺' + fmt(c.tm)}</div></div>
          <div class="kitem"><div class="kl">Değer</div><div class="kv">₺${fmt(c.tg)}</div></div>
          <div class="kitem"><div class="kl">Günlük ₺</div><div class="kv ${tlClass(c.gunlukKZ)}">${fullSign(c.gunlukKZ)}₺${fmt(Math.abs(c.gunlukKZ))}</div></div>
          <div class="kitem"><div class="kl">Günlük %</div><div class="kv">${badge(c.gunlukP)}</div></div>
          <div class="kitem"><div class="kl">K/Z</div><div class="kv ${tlClass(c.kz)}">${fullSign(c.kz)}₺${fmt(Math.abs(c.kz))}</div></div>
          <div class="kitem"><div class="kl">Getiri</div><div class="kv">${badge(c.kzp)}</div></div>
        </div>
      </div>
    </div>`;
  }

  // Altin (fiziksel)
  if (altin.length > 0) {
    const gramFiyat = (prices.gram_altin_tl || {}).guncel || 0;
    html += `<div class="section">
      <h3>🥇 Altın <span class="subtotal">₺${fmt(altinTop)}</span></h3>
      <div style="overflow-x:auto"><table><thead><tr>
        <th>KOD</th><th>GRAM</th><th>BİRİM ₺/gr</th><th>TOPLAM ₺</th><th>AĞIRLIK</th><th>GÜNLÜK ₺</th><th>GÜNLÜK %</th>
      </tr></thead><tbody>`;
    altin.forEach(a => {
      const w = altinTop > 0 ? (a.tg / altinTop) * 100 : 0;
      html += `<tr>
        <td>${a.kod}</td>
        <td>${fmt(a.adet)}</td>
        <td>₺${fmt(gramFiyat)}</td>
        <td>₺${fmt(a.tg)}</td>
        <td>${weightBar(w)} ${w.toFixed(1)}%</td>
        <td class="${tlClass(a.gunlukKZ)}">${tlSign(a.gunlukKZ)}₺${fmt(Math.abs(a.gunlukKZ))}</td>
        <td>${badge(a.gunlukP)}</td>
      </tr>`;
    });
    const t_gk = sum(altin, 'gunlukKZ');
    const t_gp = (altinTop - t_gk) > 0 ? (t_gk / (altinTop - t_gk)) * 100 : 0;
    html += `</tbody><tfoot><tr>
      <td>TOPLAM</td><td colspan="2"></td><td>₺${fmt(altinTop)}</td><td>100.0%</td>
      <td class="${tlClass(t_gk)}">${tlSign(t_gk)}₺${fmt(Math.abs(t_gk))}</td>
      <td>${badge(t_gp)}</td>
    </tr></tfoot></table></div></div>`;
  }

  // Alacak (varsa)
  if (alacak.length > 0) {
    html += `<div class="section">
      <h3>💰 Alacak <span class="subtotal">₺${fmt(alacakTop)}</span></h3>
      <div style="overflow-x:auto"><table><thead><tr>
        <th>Kim</th><th>Tutar ₺</th>
      </tr></thead><tbody>`;
    alacak.forEach(a => {
      html += `<tr><td>${a.kod}</td><td>${fmt(a.tg)}</td></tr>`;
    });
    html += `</tbody></table></div></div>`;
  }

  // Nakit (varsa) — satilan hisse takas bekleyen tutar vb.
  if (nakit.length > 0) {
    html += `<div class="section">
      <h3>💵 Nakit <span class="subtotal">₺${fmt(nakitTop)}</span></h3>
      <div style="overflow-x:auto"><table><thead><tr>
        <th>Döviz</th><th>Tutar ₺</th>
      </tr></thead><tbody>`;
    nakit.forEach(n => {
      html += `<tr><td>${n.kod}</td><td>${fmt(n.tg)}</td></tr>`;
    });
    html += `</tbody></table></div></div>`;
  }

  return { html, toplam, maliyet, kz, gunlukKZ };
}

function renderAile(portfoyler, prices) {
  const tip = (arr, t) => arr.filter(x => x.tip === t);
  const oz = (portfoyler.ozkan || []).map(x => enrichItem(x, prices));
  const dr = (portfoyler.derya || []).map(x => enrichItem(x, prices));

  // Aile Aktif Yatırım: Özkan(hisse+fon+yurtdısı+altınfonu+kripto) + Derya(hisse+altın)
  const aktifOz = [...tip(oz,'hisse'), ...tip(oz,'fon'), ...tip(oz,'yurtdisifonu'), ...tip(oz,'altinfonu'), ...tip(oz,'kripto')];
  const aktifDr = [...tip(dr,'hisse'), ...tip(dr,'altin')];
  const aktifOzTop = sum(aktifOz, 'tg');
  const aktifDrTop = sum(aktifDr, 'tg');
  const aileAktifTop = aktifOzTop + aktifDrTop;

  // Aile Emeklilik
  const emOz = tip(oz, 'emeklilik');
  const emDr = tip(dr, 'emeklilik');
  const emOzTop = sum(emOz, 'tg');
  const emDrTop = sum(emDr, 'tg');
  const aileEmTop = emOzTop + emDrTop;

  // Alacak (sadece Özkan)
  const alacakTop = sum(tip(oz,'alacak'), 'tg');

  // Nakit (her iki kişi de olabilir) — satilan hisse takas bekleyen tutar vb.
  const nakitTop = sum(tip(oz,'nakit'), 'tg') + sum(tip(dr,'nakit'), 'tg');

  const aileToplam = aileAktifTop + aileEmTop + alacakTop + nakitTop;

  // Günlük K/Z
  const aileGK = sum(oz,'gunlukKZ') + sum(dr,'gunlukKZ');
  const aileGP = (aileToplam - aileGK) > 0 ? aileGK / (aileToplam - aileGK) * 100 : 0;

  let html = `
    <div class="cards-row">
      <div class="card dark">
        <div class="clabel">Aile Aktif Yatırım</div>
        <div class="cval">₺${fmt(aileAktifTop)}</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:5px">Özkan ₺${fmt(aktifOzTop)} · Derya ₺${fmt(aktifDrTop)}</div>
      </div>
      <div class="card">
        <div class="clabel">Aile Emeklilik</div>
        <div class="cval">₺${fmt(aileEmTop)}</div>
        <div style="font-size:11px;color:#64748b;margin-top:5px">Özkan ₺${fmt(emOzTop)} · Derya ₺${fmt(emDrTop)}</div>
      </div>
      <div class="card">
        <div class="clabel">Aile Toplam</div>
        <div class="cval">₺${fmt(aileToplam)}</div>
      </div>
      <div class="card">
        <div class="clabel">Günlük K/Z</div>
        <div class="cval ${tlClass(aileGK)}">${tlSign(aileGK)}₺${fmt(Math.abs(aileGK))}</div>
        <div style="margin-top:4px">${badge(aileGP)}</div>
      </div>
    </div>`;

  // Kategori dağılım tablosu
  const tipSirasi = ['hisse','fon','yurtdisifonu','altinfonu','kripto','altin','nakit','emeklilik','alacak'];
  const tipLabel  = {
    hisse:'📈 Hisse', fon:'🏦 Fon', yurtdisifonu:'🌍 Yurtdışı Fon',
    altinfonu:'🏦 Altın Fonu', kripto:'₿ Kripto',
    altin:'🥇 Altın', nakit:'💵 Nakit', emeklilik:'🏛️ Emeklilik', alacak:'💰 Alacak'
  };

  html += `<div class="section">
    <h3>📊 Kategori Dağılımı <span class="subtotal">Aile Toplam ₺${fmt(aileToplam)}</span></h3>
    <div style="overflow-x:auto"><table>
    <thead><tr>
      <th style="text-align:left">Kategori</th>
      <th>Özkan</th><th>Derya</th><th>Aile Toplam</th>
      <th>Pay %</th><th>Günlük ₺</th><th>Günlük %</th>
    </tr></thead><tbody>`;

  for (const t of tipSirasi) {
    const ozI = tip(oz, t);
    const drI = tip(dr, t);
    if (!ozI.length && !drI.length) continue;
    const ozTop = sum(ozI,'tg');
    const drTop = sum(drI,'tg');
    const tipTop = ozTop + drTop;
    const pay = aileToplam > 0 ? tipTop / aileToplam * 100 : 0;
    const tipGK = sum(ozI,'gunlukKZ') + sum(drI,'gunlukKZ');
    const tipGP = (tipTop - tipGK) > 0 ? tipGK / (tipTop - tipGK) * 100 : 0;
    html += `<tr>
      <td style="text-align:left;font-weight:600">${tipLabel[t] || t}</td>
      <td>${ozTop > 0 ? '₺'+fmt(ozTop) : '—'}</td>
      <td>${drTop > 0 ? '₺'+fmt(drTop) : '—'}</td>
      <td style="font-weight:700">₺${fmt(tipTop)}</td>
      <td>${weightBar(pay)}</td>
      <td class="${tlClass(tipGK)}">${tipGK!==0 ? tlSign(tipGK)+'₺'+fmt(Math.abs(tipGK)) : '—'}</td>
      <td>${tipGK!==0 ? badge(tipGP) : '—'}</td>
    </tr>`;
  }

  // TOPLAM satırı
  const tumGK = sum(oz,'gunlukKZ') + sum(dr,'gunlukKZ');
  const tumGP = (aileToplam - tumGK) > 0 ? tumGK / (aileToplam - tumGK) * 100 : 0;
  html += `</tbody><tfoot><tr>
    <td style="text-align:left">TOPLAM</td>
    <td>₺${fmt(sum(oz,'tg'))}</td>
    <td>₺${fmt(sum(dr,'tg'))}</td>
    <td style="font-weight:700">₺${fmt(aileToplam)}</td>
    <td>100.0%</td>
    <td class="${tlClass(tumGK)}">${tlSign(tumGK)}₺${fmt(Math.abs(tumGK))}</td>
    <td>${badge(tumGP)}</td>
  </tr></tfoot></table></div></div>`;

  return { html, toplam: aileToplam, gunlukKZ: aileGK };
}

function render(portfoy, prices, benchmark, gecmis) {
  // Benchmark verisini global tut (dropdown/donem degisikliginde tekrar kullanmak icin)
  _benchmarkData = benchmark;
  _gecmisData = gecmis;
  const portfoyler = portfoy.portfoyler || {};
  const rendered = {};
  let genTop = 0, genMal = 0, genGK = 0;

  for (const [name, data] of Object.entries(portfoyler)) {
    const r = renderPortfoy(name, data, prices);
    rendered[name] = r;
    genTop += r.toplam;
    genMal += r.maliyet;
    genGK += r.gunlukKZ;
  }

  const genKZ = genTop - genMal;
  const genKZP = genMal > 0 ? (genTop/genMal - 1) * 100 : 0;
  const genGP = (genTop - genGK) > 0 ? genGK / (genTop - genGK) * 100 : 0;
  const names = Object.keys(portfoyler);
  const displayNames = { ozkan: 'Özkan', derya: 'Derya', aile: 'Aile' };
  const aile = renderAile(portfoyler, prices);

  const lastUpdate = prices.son_guncelleme
    ? new Date(prices.son_guncelleme).toLocaleString('tr-TR', {dateStyle:'long', timeStyle:'short'})
    : 'Henüz güncelleme yapılmadı';
  document.getElementById('last-update').textContent = lastUpdate + ' • Fintables 15 dk gecikmeli';

  document.getElementById('genel-toplam').textContent = '₺' + fmt(genTop);

  // Günlük Kazanç: işaret + renk + yüzde
  const gkSign = genGK > 0 ? '+' : (genGK < 0 ? '-' : '');
  const gkCls  = genGK > 0 ? 'green' : (genGK < 0 ? 'red' : '');
  const gpSign = genGP > 0 ? '+' : (genGP < 0 ? '-' : '');
  const gpStr  = Math.abs(genGP).toFixed(2) + '%';

  const summaryHtml = `
    <div class="summary-card">
      <div class="label">Günlük Kazanç</div>
      <div class="val ${gkCls}">${gkSign}₺${fmt(Math.abs(genGK))}</div>
      <div class="val ${gkCls}" style="font-size:12px;margin-top:2px">${gpSign}${gpStr}</div>
    </div>
    ${names.map(n => `<div class="summary-card"><div class="label">${displayNames[n] || n} Varlık</div><div class="val">₺${fmt(rendered[n].toplam)}</div></div>`).join('')}
  `;
  document.getElementById('summary-row').innerHTML = summaryHtml;

  const tabsHtml = names.map((n,i) =>
    `<button class="tab ${i===0?'active':''}" data-panel="${n}" onclick="switchTab('${n}')">👤 ${displayNames[n] || n} • ₺${fmt(rendered[n].toplam)}</button>`
  ).join('') +
  `<button class="tab" data-panel="aile" onclick="switchTab('aile')">👨‍👩‍👧 Aile • ₺${fmt(aile.toplam)}</button>` +
  `<button class="tab" data-panel="benchmark" onclick="switchTab('benchmark')">📊 Benchmark</button>` +
  `<button class="tab" data-panel="gecmis" onclick="switchTab('gecmis')">📋 Geçmiş Veriler</button>` +
  `<button class="tab" data-panel="grafik" onclick="switchTab('grafik')">📈 Grafik</button>`;
  document.getElementById('tabs').innerHTML = tabsHtml;

  const panelsHtml = names.map((n,i) =>
    `<div id="panel-${n}" class="${i===0?'':'hidden'}">${rendered[n].html}</div>`
  ).join('') +
  `<div id="panel-aile" class="hidden">${aile.html}</div>` +
  `<div id="panel-benchmark" class="hidden">${benchmarkPanelHtml()}</div>` +
  `<div id="panel-gecmis" class="hidden">${gecmisPanelHtml()}</div>` +
  `<div id="panel-grafik" class="hidden">${grafikPanelHtml()}</div>`;
  document.getElementById('panels').innerHTML = panelsHtml;
}

function switchTab(name) {
  document.querySelectorAll('[id^="panel-"]').forEach(el => {
    el.className = el.id === 'panel-' + name ? '' : 'hidden';
  });
  document.querySelectorAll('.tab').forEach(el => {
    el.className = 'tab' + (el.dataset.panel === name ? ' active' : '');
  });
  // Chart canvasli sekmeler: canvas gizliyken Chart.js boyut alamaz, gosterdikten sonra cizdir
  if (name === 'benchmark') setTimeout(refreshBenchmark, 0);
  else if (name === 'gecmis') setTimeout(refreshGecmis, 0);
  else if (name === 'grafik') setTimeout(refreshGrafik, 0);
}

// Bir tarihten "donem" kadar geriye git, baslangic tarihi don.
function donemBaslangic(donem, sonTarihStr) {
  const son = new Date(sonTarihStr + 'T00:00:00');
  const d = new Date(son);
  switch (donem) {
    case '1H': d.setDate(d.getDate() - 7); break;
    case '1A': d.setMonth(d.getMonth() - 1); break;
    case 'YTD': d.setMonth(0); d.setDate(1); break;
    case '6A': d.setMonth(d.getMonth() - 6); break;
    case '1Y': d.setFullYear(d.getFullYear() - 1); break;
    case '3Y': d.setFullYear(d.getFullYear() - 3); break;
    case '5Y': d.setFullYear(d.getFullYear() - 5); break;
  }
  return d.toISOString().slice(0, 10);
}

// gecmis.json verisinden secime gore portfoy zaman serisi cikar: {tarih: tl}
function portfoySerisi(secim, gecmis) {
  if (!gecmis || !gecmis.gunler) return {};
  const seri = {};
  for (const [tarih, gun] of Object.entries(gecmis.gunler)) {
    const o = gun.ozkan || {};
    const d = gun.derya || {};
    const ok = o.kategoriler || {};
    const dk = d.kategoriler || {};
    const get = (obj, k) => Number(obj[k] || 0);
    let val = null;
    switch (secim) {
      case 'ozkan_genel':     val = Number(o.toplam || 0); break;
      case 'ozkan_aktif':     val = get(ok,'hisse')+get(ok,'fon')+get(ok,'altinfonu')+get(ok,'yurtdisifonu')+get(ok,'kripto'); break;
      case 'ozkan_hfy':       val = get(ok,'hisse')+get(ok,'fon')+get(ok,'yurtdisifonu'); break;
      case 'ozkan_hisse':     val = get(ok,'hisse'); break;
      case 'ozkan_fon':       val = get(ok,'fon'); break;
      case 'ozkan_yurtdisi':  val = get(ok,'yurtdisifonu'); break;
      case 'ozkan_altinfonu': val = get(ok,'altinfonu'); break;
      case 'ozkan_kripto':    val = get(ok,'kripto'); break;
      case 'ozkan_emeklilik': val = get(ok,'emeklilik'); break;
      case 'derya_genel':     val = Number(d.toplam || 0); break;
      case 'derya_hisse':     val = get(dk,'hisse'); break;
      case 'derya_altin':     val = get(dk,'altin'); break;
      case 'derya_emeklilik': val = get(dk,'emeklilik'); break;
      case 'aile_toplam':     val = Number(gun.genel_toplam || 0); break;
      case 'aile_aktif':
        val = get(ok,'hisse')+get(ok,'fon')+get(ok,'altinfonu')+get(ok,'yurtdisifonu')+get(ok,'kripto')+get(dk,'hisse')+get(dk,'altin');
        break;
    }
    if (val != null && val > 0) seri[tarih] = val;
  }
  return seri;
}

// Bir donem icin kumulatif % getiri noktalari: [{x:'YYYY-MM-DD', y:pct}]
// baselineSeri: kumulatif hesabin sifir noktasi olan seri (genelde benchmark veya portfoy serisi),
// bizimkinde her seri kendi baseline'ina gore.
function cumulativeSeri(seri, baslangic, bitis) {
  const tarihler = Object.keys(seri).filter(t => t >= baslangic && t <= bitis).sort();
  if (tarihler.length < 1) return [];
  const baseline = seri[tarihler[0]];
  if (!baseline || baseline <= 0) return [];
  return tarihler.map(t => ({ x: t, y: ((seri[t] / baseline) - 1) * 100 }));
}

// Bir donem icin tek skaler % getiri (baslangic -> bitis)
function donemGetirisi(seri, baslangic, bitis) {
  const tarihler = Object.keys(seri).filter(t => t >= baslangic && t <= bitis).sort();
  if (tarihler.length < 2) return null;
  const ilk = seri[tarihler[0]];
  const son = seri[tarihler[tarihler.length - 1]];
  if (!ilk || ilk <= 0) return null;
  return ((son / ilk) - 1) * 100;
}

// TUFE serisi aylik bazda yyyy-MM seklinde. Ileride genisletmek icin simdilik
// donem tablosu kismi kullanir, grafikte gosterilmez (tarih formati uyumsuz).
function tufeDonemGetirisi(tufe, baslangic, bitis) {
  if (!tufe) return null;
  // tufe = {gerceklesen: {'YYYY-MM': float}, ...}. Kumulatif: (1+r1)(1+r2)...-1
  const aylar = Object.keys(tufe).filter(ay => {
    return ay >= baslangic.slice(0,7) && ay <= bitis.slice(0,7);
  }).sort();
  if (aylar.length === 0) return null;
  let bir = 1;
  for (const ay of aylar) {
    bir *= (1 + (Number(tufe[ay]) || 0) / 100);
  }
  return (bir - 1) * 100;
}

function refreshBenchmark() {
  const sel = document.getElementById('bench-select');
  const secim = sel ? sel.value : 'aile_toplam';
  const aktifBtn = document.querySelector('.bench-period-btn.active');
  const donem = aktifBtn ? aktifBtn.dataset.period : '1A';

  const warnEl = document.getElementById('bench-warn-container');
  if (!_benchmarkData || !_benchmarkData.seriler) {
    if (warnEl) warnEl.innerHTML = `<div class="bench-warn">⚠️ Benchmark verisi yüklenemedi (benchmark_gecmis.json bulunamadı).</div>`;
    return;
  }
  warnEl.innerHTML = '';

  const benchSeriler = _benchmarkData.seriler;
  const portfoySer = portfoySerisi(secim, _gecmisData);

  // Bitis: bugun veya benchmark son tarihinin minumumu (gelecek tarih olmasin)
  const bugun = new Date().toISOString().slice(0, 10);
  let benchSonTarih = bugun;
  for (const b of BENCH_SERILER.filter(b => b.key !== 'tufe')) {
    const seri = benchSeriler[b.key] || {};
    const tarihler = Object.keys(seri).sort();
    if (tarihler.length) {
      const son = tarihler[tarihler.length - 1];
      if (son > benchSonTarih) benchSonTarih = son;
    }
  }
  const bitis = bugun > benchSonTarih ? bugun : benchSonTarih;
  const baslangic = donemBaslangic(donem, bitis);

  // Portfoy verisi var mi?
  const portfoyTarihler = Object.keys(portfoySer).filter(t => t >= baslangic && t <= bitis);
  if (Object.keys(portfoySer).length === 0) {
    warnEl.innerHTML = `<div class="bench-warn">ℹ️ Portföy zaman serisi henüz yok — milat tarihi 1 Haziran 2026. Bu tarihten itibaren her gece 18:35 kapanış sonrası snapshot eklenir.</div>`;
  } else if (portfoyTarihler.length < 2) {
    warnEl.innerHTML = `<div class="bench-warn">ℹ️ Bu dönem için yeterli portföy snapshot yok (en az 2 gün gerek). Daha kısa veya YTD/3Y/5Y deneyin.</div>`;
  }

  // ── ÇİZGİ GRAFİK ──
  const secilenLabel = BENCH_SECIMLER.flatMap(g => g.items).find(it => it.v === secim)?.t || secim;

  const datasets = [];
  const portfoyPoints = cumulativeSeri(portfoySer, baslangic, bitis);
  if (portfoyPoints.length > 0) {
    datasets.push({
      label: secilenLabel,
      data: portfoyPoints,
      borderColor: PORTFOY_RENK,
      backgroundColor: PORTFOY_RENK + '20',
      borderWidth: 3,
      pointRadius: 0,
      pointHoverRadius: 4,
      tension: 0.15,
    });
  }
  for (const b of BENCH_SERILER.filter(b => b.key !== 'tufe')) {
    const seri = benchSeriler[b.key] || {};
    const points = cumulativeSeri(seri, baslangic, bitis);
    if (points.length === 0) continue;
    datasets.push({
      label: b.ad,
      data: points,
      borderColor: b.renk,
      backgroundColor: b.renk + '20',
      borderWidth: 1.8,
      pointRadius: 0,
      pointHoverRadius: 4,
      borderDash: [4, 3],
      tension: 0.15,
    });
  }

  // Chart.js cizimi
  const canvas = document.getElementById('bench-canvas');
  if (_benchChart) { _benchChart.destroy(); _benchChart = null; }
  if (canvas && datasets.length > 0) {
    _benchChart = new Chart(canvas, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { type: 'time', time: { parser: 'yyyy-MM-dd', unit: 'month', displayFormats: { month: 'MMM yy' } },
               ticks: { color: '#64748b', maxRotation: 0, autoSkip: true, maxTicksLimit: 8 },
               grid: { color: 'rgba(148,163,184,0.08)' } },
          y: { ticks: { color: '#64748b', callback: v => v.toFixed(0) + '%' },
               grid: { color: 'rgba(148,163,184,0.08)' } },
        },
        plugins: {
          legend: { position: 'bottom', labels: { color: '#64748b', boxWidth: 12, font: { size: 11 } } },
          tooltip: {
            callbacks: {
              title: items => items[0]?.parsed?.x ? new Date(items[0].parsed.x).toLocaleDateString('tr-TR') : '',
              label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y >= 0 ? '+' : ''}${ctx.parsed.y.toFixed(2)}%`,
            },
          },
        },
      },
    });
  } else if (canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Bu dönem için yeterli veri yok', canvas.width/2, canvas.height/2);
  }

  // ── 7×7 KARŞILAŞTIRMA TABLOSU ──
  // Her donem icin: secilen varlik + 4 benchmark + TUFE + Fark satiri
  const satirlar = [];
  const portfoyGetirileri = {};
  const benchGetirileri = {};  // {donem: {benchKey: pct}}

  for (const dn of BENCH_DONEMLER) {
    const dBaslangic = donemBaslangic(dn, bitis);
    const portG = donemGetirisi(portfoySer, dBaslangic, bitis);
    portfoyGetirileri[dn] = portG;
    benchGetirileri[dn] = {};
    for (const b of BENCH_SERILER) {
      if (b.key === 'tufe') {
        benchGetirileri[dn].tufe = tufeDonemGetirisi(benchSeriler.tufe_aylik_gerceklesen, dBaslangic, bitis);
      } else {
        benchGetirileri[dn][b.key] = donemGetirisi(benchSeriler[b.key] || {}, dBaslangic, bitis);
      }
    }
  }

  const fmtPct = v => v == null ? '—' : `<span class="${v>=0?'val-pos':'val-neg'}">${v>=0?'+':''}${v.toFixed(2)}%</span>`;

  let tHtml = `<div class="bench-table-wrap"><table class="bench-table"><thead><tr>
    <th></th>${BENCH_DONEMLER.map(d => `<th style="text-align:right">${d}</th>`).join('')}
  </tr></thead><tbody>`;
  // Secilen varlik satiri
  tHtml += `<tr class="bench-row-self"><td>${secilenLabel.length > 40 ? secilenLabel.slice(0, 38) + '…' : secilenLabel}</td>`;
  for (const dn of BENCH_DONEMLER) tHtml += `<td>${fmtPct(portfoyGetirileri[dn])}</td>`;
  tHtml += `</tr>`;
  // Her benchmark
  for (const b of BENCH_SERILER) {
    tHtml += `<tr><td>${b.ad}</td>`;
    for (const dn of BENCH_DONEMLER) tHtml += `<td>${fmtPct(benchGetirileri[dn][b.key])}</td>`;
    tHtml += `</tr>`;
  }
  // Fark: en iyi benchmark - secilen varlik (her donem)
  tHtml += `<tr class="bench-row-fark"><td>Fark (en iyi − varlık)</td>`;
  for (const dn of BENCH_DONEMLER) {
    const portG = portfoyGetirileri[dn];
    const allBench = Object.values(benchGetirileri[dn]).filter(v => v != null);
    if (portG == null || allBench.length === 0) {
      tHtml += `<td>—</td>`;
    } else {
      const enIyi = Math.max(...allBench);
      const fark = enIyi - portG;
      tHtml += `<td>${fmtPct(fark)}</td>`;
    }
  }
  tHtml += `</tr></tbody></table></div>`;

  document.getElementById('bench-table-container').innerHTML = tHtml;
}

// ═══════════════════════════════════════════════
// GECMIS VERILER TABI (Excel benzeri tablo)
// ═══════════════════════════════════════════════
// Kullanici tarafindan istenen 12 sutun. Tarih sticky-left, digerleri akar.
const GECMIS_KOLONLAR = [
  { key: 'tarih',        ad: 'Tarih' },
  { key: 'ozkan_ea',     ad: 'Özkan (em+alacak hariç)' },
  { key: 'ozkan_top',    ad: 'Özkan Toplam' },
  { key: 'ozkan_em',     ad: 'Özkan Emeklilik' },
  { key: 'kripto',       ad: 'Kripto' },
  { key: 'derya_e',      ad: 'Derya (em hariç)' },
  { key: 'derya_top',    ad: 'Derya Toplam' },
  { key: 'derya_em',     ad: 'Derya Emeklilik' },
  { key: 'derya_altin',  ad: 'Derya Altın' },
  { key: 'aile_top',     ad: 'Aile Toplam' },
  { key: 'aile_ea',      ad: 'Aile (em+alacak hariç)' },
  { key: 'aile_em',      ad: 'Aile Emeklilik' },
];

function gecmisDegerleri(gun) {
  // Bir gun snapshot'indan 12 sutunun TL degerlerini hesapla.
  const o = gun.ozkan || {};
  const d = gun.derya || {};
  const ok = o.kategoriler || {};
  const dk = d.kategoriler || {};
  const g = (obj, k) => Number(obj[k] || 0);
  const ozkanEm = g(ok,'emeklilik');
  const deryaEm = g(dk,'emeklilik');
  const ozkanAlacak = g(ok,'alacak');
  const ozkanTop = Number(o.toplam || 0);
  const deryaTop = Number(d.toplam || 0);
  const aileTop = Number(gun.genel_toplam || (ozkanTop + deryaTop));
  return {
    ozkan_ea:    ozkanTop - ozkanEm - ozkanAlacak,
    ozkan_top:   ozkanTop,
    ozkan_em:    ozkanEm,
    kripto:      g(ok,'kripto'),
    derya_e:     deryaTop - deryaEm,
    derya_top:   deryaTop,
    derya_em:    deryaEm,
    derya_altin: g(dk,'altin'),
    aile_top:    aileTop,
    aile_ea:     aileTop - ozkanEm - deryaEm - ozkanAlacak,
    aile_em:     ozkanEm + deryaEm,
  };
}

function gecmisPanelHtml() {
  const cols = GECMIS_KOLONLAR.map(c => `<th>${c.ad}</th>`).join('');
  return `
    <div class="section">
      <div class="gecmis-controls">
        <div class="gecmis-date-wrap">
          <label>Tarihe git</label>
          <input type="date" id="gecmis-date" class="gecmis-date" onchange="gecmisTariheGit()">
        </div>
        <button class="gecmis-clear-btn" onclick="gecmisVurguTemizle()">Vurguyu temizle</button>
      </div>
      <div class="gecmis-table-wrap">
        <table class="gecmis-table">
          <thead><tr>${cols}</tr></thead>
          <tbody id="gecmis-tbody"></tbody>
        </table>
      </div>
      <div id="gecmis-status" class="bench-info" style="margin-top:14px"></div>
    </div>
  `;
}

function refreshGecmis() {
  const tbody = document.getElementById('gecmis-tbody');
  const status = document.getElementById('gecmis-status');
  if (!tbody || !status) return;

  if (!_rawGecmis || !_rawGecmis.gunler || Object.keys(_rawGecmis.gunler).length === 0) {
    tbody.innerHTML = `<tr><td colspan="${GECMIS_KOLONLAR.length}" class="gecmis-empty">📭 Geçmiş veri henüz yok. <b>Milat tarihi 1 Haziran 2026</b>. Bu tarihten itibaren her iş günü 18:35 kapanışından sonra otomatik kayıt eklenecek.</td></tr>`;
    status.innerHTML = `<b>Şu an itibarıyla 0 günlük kayıt var.</b> İlk satır 1 Haziran 2026 akşamı oluşacak.`;
    return;
  }

  // Privacy modunda _gecmisData zaten normalize edilmis (doRender icinde)
  const gunler = _gecmisData.gunler;
  const tarihler = Object.keys(gunler).sort().reverse();  // en yeni ustte

  // Tarih input min/max ayarla
  const dateInput = document.getElementById('gecmis-date');
  if (dateInput && tarihler.length) {
    dateInput.min = tarihler[tarihler.length - 1];
    dateInput.max = tarihler[0];
  }

  let html = '';
  for (const t of tarihler) {
    const vals = gecmisDegerleri(gunler[t]);
    html += `<tr data-tarih="${t}">`;
    html += `<td>${t}</td>`;
    for (const c of GECMIS_KOLONLAR.slice(1)) {
      const v = vals[c.key];
      html += `<td>${v != null ? '₺' + fmt(v) : '—'}</td>`;
    }
    html += `</tr>`;
  }
  tbody.innerHTML = html;
  status.innerHTML = `${tarihler.length} günlük kayıt — en yeni: <b>${tarihler[0]}</b>, en eski: <b>${tarihler[tarihler.length-1]}</b>.`;
}

function gecmisTariheGit() {
  const d = document.getElementById('gecmis-date');
  if (!d || !d.value) return;
  const tarih = d.value;
  // Once tum highlight'lari temizle
  document.querySelectorAll('#gecmis-tbody tr.highlight').forEach(tr => tr.classList.remove('highlight'));
  // Hedef satiri bul
  const target = document.querySelector(`#gecmis-tbody tr[data-tarih="${tarih}"]`);
  if (target) {
    target.classList.add('highlight');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function gecmisVurguTemizle() {
  document.querySelectorAll('#gecmis-tbody tr.highlight').forEach(tr => tr.classList.remove('highlight'));
  const d = document.getElementById('gecmis-date');
  if (d) d.value = '';
}

// ═══════════════════════════════════════════════
// GRAFIK TABI (sadece secilen varlik, benchmark karsilastirmasi yok)
// ═══════════════════════════════════════════════
let _grafikChart = null;

function grafikPanelHtml() {
  const opts = BENCH_SECIMLER.map(g =>
    `<optgroup label="${g.grup}">` +
    g.items.map(it => `<option value="${it.v}">${it.t}</option>`).join('') +
    `</optgroup>`
  ).join('');
  const periods = BENCH_DONEMLER.map(p =>
    `<button class="bench-period-btn ${p==='1A'?'active':''}" data-period="${p}" onclick="setGrafikPeriod('${p}')">${p}</button>`
  ).join('');
  return `
    <div class="section">
      <div class="grafik-controls">
        <div class="bench-select-wrap">
          <label>Varlık</label>
          <select class="bench-select" id="grafik-select" onchange="refreshGrafik()">${opts}</select>
        </div>
        <div class="bench-select-wrap">
          <label>Dönem</label>
          <div class="bench-periods" id="grafik-periods">${periods}</div>
        </div>
      </div>
      <div class="grafik-chart-wrap"><canvas id="grafik-canvas"></canvas></div>
      <div id="grafik-status" class="bench-info"></div>
    </div>
  `;
}

function setGrafikPeriod(p) {
  document.querySelectorAll('#grafik-periods .bench-period-btn').forEach(b => {
    b.className = 'bench-period-btn' + (b.dataset.period === p ? ' active' : '');
  });
  refreshGrafik();
}

function refreshGrafik() {
  const sel = document.getElementById('grafik-select');
  const status = document.getElementById('grafik-status');
  if (!sel || !status) return;
  const secim = sel.value;
  const aktifBtn = document.querySelector('#grafik-periods .bench-period-btn.active');
  const donem = aktifBtn ? aktifBtn.dataset.period : '1A';

  const portfoySer = portfoySerisi(secim, _gecmisData);
  if (Object.keys(portfoySer).length === 0) {
    status.innerHTML = `📭 Portföy zaman serisi henüz yok — <b>milat tarihi 1 Haziran 2026</b>. Bu tarihten itibaren her gün 18:35 kapanış sonrası snapshot eklenir.`;
    if (_grafikChart) { _grafikChart.destroy(); _grafikChart = null; }
    const canvas = document.getElementById('grafik-canvas');
    if (canvas) { const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); }
    return;
  }

  const bugun = new Date().toISOString().slice(0, 10);
  const tarihler = Object.keys(portfoySer).sort();
  const sonTarih = tarihler[tarihler.length - 1];
  const bitis = bugun > sonTarih ? bugun : sonTarih;
  const baslangic = donemBaslangic(donem, bitis);

  // TL mutlak deger noktalari (yuzde degil)
  const donemTarihler = Object.keys(portfoySer).filter(t => t >= baslangic && t <= bitis).sort();
  const points = donemTarihler.map(t => ({ x: t, y: portfoySer[t] }));
  const secilenLabel = BENCH_SECIMLER.flatMap(g => g.items).find(it => it.v === secim)?.t || secim;

  if (points.length < 2) {
    status.innerHTML = `ℹ️ <b>${secilenLabel}</b> için bu dönemde yeterli snapshot yok (en az 2 gün gerek). Daha uzun bir dönem deneyin.`;
    if (_grafikChart) { _grafikChart.destroy(); _grafikChart = null; }
    const canvas = document.getElementById('grafik-canvas');
    if (canvas) { const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); }
    return;
  }

  const ilkTL = points[0].y;
  const sonTL = points[points.length-1].y;
  const farkTL = sonTL - ilkTL;
  const farkPct = ilkTL > 0 ? ((sonTL / ilkTL) - 1) * 100 : 0;
  const renk = farkTL >= 0 ? '#10b981' : '#ef4444';
  status.innerHTML = `<b>${secilenLabel}</b> — ${donem} dönemde: <b style="color:${renk}">${farkTL>=0?'+':'-'}₺${fmt(Math.abs(farkTL))}</b> (<b style="color:${renk}">${farkPct>=0?'+':''}${farkPct.toFixed(2)}%</b>) — ${points.length} gün`;

  // TL eksen icin kisa format: ₺1.2M, ₺500K, ₺250
  const fmtTLkisa = v => {
    const abs = Math.abs(v);
    if (abs >= 1e6) return '₺' + (v/1e6).toFixed(2) + 'M';
    if (abs >= 1e3) return '₺' + (v/1e3).toFixed(0) + 'K';
    return '₺' + Math.round(v);
  };

  const canvas = document.getElementById('grafik-canvas');
  if (_grafikChart) { _grafikChart.destroy(); _grafikChart = null; }
  if (!canvas) return;
  _grafikChart = new Chart(canvas, {
    type: 'line',
    data: {
      datasets: [{
        label: secilenLabel,
        data: points,
        borderColor: PORTFOY_RENK,
        backgroundColor: PORTFOY_RENK + '25',
        borderWidth: 3,
        fill: true,
        pointRadius: 0,
        pointHoverRadius: 5,
        tension: 0.15,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { type: 'time', time: { parser: 'yyyy-MM-dd', unit: 'month', displayFormats: { month: 'MMM yy' } },
             ticks: { color: '#64748b', maxRotation: 0, autoSkip: true, maxTicksLimit: 8 },
             grid: { color: 'rgba(148,163,184,0.08)' } },
        y: { ticks: { color: '#64748b', callback: fmtTLkisa },
             grid: { color: 'rgba(148,163,184,0.08)' } },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => items[0]?.parsed?.x ? new Date(items[0].parsed.x).toLocaleDateString('tr-TR') : '',
            label: ctx => '₺' + fmt(ctx.parsed.y),
          },
        },
      },
    },
  });
}
</script>
